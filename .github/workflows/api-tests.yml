name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:
    inputs:
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          services=(
            "http://localhost:8080/health"
            "http://localhost:8081/api/movies/health"
            "http://localhost:8082/api/events/health"
            "http://localhost:8000/health"
          )

          for url in "${services[@]}"; do
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                ready=true
                break
              fi
              sleep 5
            done

            if [ "$ready" != "true" ]; then
              echo "Service did not become ready: $url"
              docker compose logs
              exit 1
            fi
          done

      - name: Build API tests image
        run: docker build -t cinemaabyss-api-tests ./tests/postman

      - name: Run API tests
        env:
          TEST_FOLDER: ${{ github.event.inputs.test_folder }}
        run: |
          args=(--environment docker --reporters cli,htmlextra,junit --timeout 30000)
          if [ -n "$TEST_FOLDER" ]; then
            args+=(--folder "$TEST_FOLDER")
          fi

          mkdir -p tests/postman/reports
          docker run --rm \
            --network=cinemaabyss-network \
            -v "${{ github.workspace }}/tests/postman/reports:/app/reports" \
            cinemaabyss-api-tests \
            "${args[@]}"

      - name: Stop services
        if: always()
        run: docker compose down -v
